[project]
name = "dlpc900"
version = "0.1.0"
description = "HID client for the TI DLPC900 DMD controller"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "hidapi>=0.15.0",
]

[project.scripts]
dmd = "dlpc900.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlpc900"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hardware tests require a physically connected DMD; exclude them by default so
# a bare `pytest` is safe on any machine (and in CI). Run them with:
#     uv run pytest -m hardware
addopts = "-m 'not hardware'"
markers = [
    "hardware: requires a physically connected DMD controller",
]
